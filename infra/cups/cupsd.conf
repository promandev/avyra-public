# CUPS sólo es accesible desde la red interna de Docker (no se publica el
# puerto 631) y la app exige sesión de un miembro del hogar antes de hablar con
# él. Por eso aquí no hay autenticación: sería una segunda contraseña sin nada
# que proteger.
LogLevel warn
MaxLogSize 1m
Listen 0.0.0.0:631
# lpadmin/lpstat del entrypoint hablan con cupsd por el socket local.
Listen /run/cups/cups.sock
# La app llama a "cups:631"; sin esto CUPS rechaza cualquier Host desconocido.
ServerAlias *
Browsing No
WebInterface No
DefaultAuthType None
MaxJobs 100
# Historial de trabajos para la lista "Recientes" de la app, pero sin guardar
# copia de los documentos una vez impresos.
PreserveJobHistory 604800
PreserveJobFiles No

<Location />
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
